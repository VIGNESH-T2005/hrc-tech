server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React Router: any unknown path falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # In production the frontend and API are served from different origins,
    # so this proxy keeps your existing /api/... calls working unchanged.
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(?:css|js|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}